<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AtticSoft</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            background: #f7f7f7;
            color: #222;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-top: 0;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
            margin-top: 30px;
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .description {
            margin-bottom: 20px;
        }

        .requirements {
            margin-top: 20px;
            padding: 18px 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .requirements h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .requirements p {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .requirements ul {
            margin: 0;
            padding-left: 20px;
        }

        .requirements li {
            margin: 4px 0;
        }

        .version {
            color: #666;
            margin-top: 22px;
            margin-bottom: 10px;
        }

        .download {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 8px;
            background: #222;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .download:hover {
            opacity: 0.8;
        }

        footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>AtticSoft</h1>

    <p class="subtitle">
        제가 만든 Windows 프로그램을 무료로 배포합니다.
    </p>


    <div class="card">

        <h2>JAV Video Manager</h2>

        <p class="description">
            로컬에 저장된 영상을 편리하게 관리할 수 있는
            Windows용 비디오 관리 프로그램입니다.
        </p>


        <div class="requirements">

            <h3>사용 전 확인사항</h3>

            <p>
                이 프로그램을 사용하려면 PC에 Python이 설치되어 있어야 합니다.(권장 버전: Python 3.10 ~ 3.13)
            </p>

        </div>


        <p class="version">
            Version 1.0
        </p>


        <a
            class="download"
            href="JAV_Video_Manager_v1.zip"
            download
        >
            Download
        </a>

    </div>


    <footer>
        © 2026 AtticSoft
    </footer>

</body>
</html>
