<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AtticSoft</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            background: #f7f7f7;
            color: #222;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-top: 0;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
            margin-top: 30px;
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .description {
            margin-bottom: 20px;
        }

        .requirements {
            margin-top: 20px;
            padding: 18px 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .requirements h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .requirements p {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .requirements ul {
            margin: 0;
            padding-left: 20px;
        }

        .requirements li {
            margin: 4px 0;
        }

        .version {
            color: #666;
            margin-top: 22px;
            margin-bottom: 10px;
        }

        .download {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 8px;
            background: #222;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .download:hover {
            opacity: 0.8;
        }

        footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>AtticSoft</h1>

    <p class="subtitle">
        일상에 편리함을 더하는 앱을 만듭니다.
    </p>


    <div class="card">
        <h2>GIF Maker</h2>
        <p class="description">동영상에서 원하는 구간을 골라 Android 휴대폰에서 GIF로 변환하세요.</p>
        <a class="download" href="gif-maker/">앱 소개 및 문의</a>
        <p><a href="gif-maker/privacy.html">GIF 메이커 개인정보처리방침</a></p>
    </div>
    <div class="card">
        <h2>화면 녹화</h2>
        <p class="description">REC 버튼으로 원하는 순간을 녹화하고, 미리보기 후 갤러리에 저장하세요.</p>
        <a class="download" href="screen-recorder/">앱 소개 및 문의</a>
        <p><a href="screen-recorder/privacy.html">화면 녹화 개인정보처리방침</a></p>
    </div>
    <footer>
        © 2026 
    </footer>

</body>
</html>
